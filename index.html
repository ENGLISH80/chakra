<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анализ чакр и энергетики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#070817; --bg2:#12113a; --card:#0e1030; --text:#e8e8f6; --muted:#9a9cc4;
  --violet:#7c5cff; --blue:#3d7bff; --gold:#f2c86b; --glow:0 0 24px rgba(124,92,255,.55);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);
  background:radial-gradient(ellipse at 20% 0%,#2a1a6e 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#102a6e 0%,transparent 50%),var(--bg);
  background-attachment:fixed;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 70% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#f2c86b,transparent),radial-gradient(1px 1px at 85% 75%,#fff,transparent),radial-gradient(1px 1px at 25% 55%,#fff,transparent);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
main{position:relative;max-width:760px;margin:0 auto;padding:32px 18px 60px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.screen{display:none;animation:fade .7s ease both}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);text-align:center;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:10px 0 40px}
.center{text-align:center}
.card{background:linear-gradient(145deg,#131543,#0b0d28);border-radius:22px;padding:26px;
  box-shadow:12px 12px 30px rgba(0,0,0,.5),-6px -6px 20px rgba(80,70,200,.08),inset 0 0 0 1px rgba(255,255,255,.04);margin-bottom:20px}
.btn{font:500 1.05rem var(--sans);color:#fff;border:0;cursor:pointer;padding:18px 34px;border-radius:999px;
  background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:var(--glow);
  transition:transform .3s,box-shadow .3s;animation:pulse 2.6s ease-in-out infinite}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 40px rgba(124,92,255,.85)}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(61,123,255,.8)}}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold);box-shadow:none;animation:none}
form h2{text-align:center;margin-bottom:22px;font-size:1.9rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:16px 0 6px}
input,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  background:#080a22;color:var(--text);font:1rem var(--sans);box-shadow:inset 4px 4px 10px rgba(0,0,0,.5);
  transition:border-color .3s,box-shadow .3s}
input:focus,select:focus{outline:none;border-color:var(--violet);box-shadow:var(--glow)}
.row{display:grid;gap:10px;grid-template-columns:1fr 1.6fr 1fr}
.row2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.err{color:#ff8fa3;text-align:center;min-height:1.2em;margin:14px 0 0;font-size:.9rem}
form .btn{display:block;margin:10px auto 0}
/* loader */
.loader{text-align:center;padding:60px 0}
.orb{width:90px;height:90px;margin:0 auto 30px;border-radius:50%;
  border:3px solid transparent;border-top-color:var(--gold);border-right-color:var(--violet);
  animation:spin 1s linear infinite;box-shadow:var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
#loadText{font-family:var(--serif);font-size:1.5rem;color:var(--gold);transition:opacity .3s}
/* results */
.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.profile .k{color:var(--muted);font-size:.78rem}
.profile .v{font-family:var(--serif);font-size:1.5rem;margin-top:4px}
.symbol{font-size:2.4rem;color:var(--gold);text-shadow:0 0 18px rgba(242,200,107,.7);line-height:1}
.chakras{display:flex;flex-direction:column;gap:10px}
.ch{display:grid;grid-template-columns:28px 1fr 46px;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;
  background:#0a0c26;cursor:pointer;border:1px solid transparent;transition:transform .3s,border-color .3s}
.ch:hover,.ch.sel{transform:translateX(4px);border-color:var(--c)}
.dot{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.ch b{font-weight:500;font-size:.95rem}
.ch small{display:block;color:var(--muted);font-size:.75rem}
.bar{height:6px;border-radius:6px;background:#1a1c46;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
#chInfo{margin-top:16px;padding:16px;border-radius:14px;background:rgba(124,92,255,.1);color:var(--muted);line-height:1.6;min-height:3em}
.visual{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.vis{position:relative;border-radius:18px;overflow:hidden;min-height:170px}
.vis .fb{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--gold),var(--violet) 35%,transparent 70%),linear-gradient(135deg,#1c1a5e,#0a1a4a);opacity:.85}
.vis.b .fb{background:conic-gradient(from 40deg,#7c5cff,#3d7bff,#f2c86b,#7c5cff)}
.vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.vis::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(7,8,23,.7)}
.text h3{color:var(--gold);margin:0 0 8px;font-size:1.5rem}
.text p{line-height:1.7;color:#cfd0ea;margin:0 0 16px}
.focus{border-left:3px solid var(--gold);padding-left:14px}
@media(max-width:560px){.profile{grid-template-columns:1fr}.row{grid-template-columns:1fr 1.4fr 1fr}.visual{grid-template-columns:1fr}.card{padding:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<main>

<!-- 1. Главный экран -->
<section id="landing" class="screen active center">
  <h1>Карта вашей энергии</h1>
  <p class="sub">Чакры, знаки зодиака и число судьбы — в одном потоке</p>
  <button class="btn" id="startBtn">✨ Анализ вашей чакры и энергетики</button>
</section>

<!-- 2. Форма -->
<section id="formScreen" class="screen">
  <form class="card" id="form" novalidate>
    <h2>Настройтесь на поток</h2>
    <div class="row2">
      <div><label for="fn">Имя</label><input id="fn" autocomplete="given-name" placeholder="Анна"></div>
      <div><label for="ln">Фамилия</label><input id="ln" autocomplete="family-name" placeholder="Иванова"></div>
    </div>
    <label>Дата рождения</label>
    <div class="row">
      <input id="d" type="number" min="1" max="31" placeholder="День" aria-label="День">
      <select id="m" aria-label="Месяц"></select>
      <input id="y" type="number" min="1900" max="2026" placeholder="Год" aria-label="Год">
    </div>
    <label for="goal">Ваша главная цель / сфера интереса</label>
    <select id="goal">
      <option value="self">Саморазвитие</option>
      <option value="love">Любовь и отношения</option>
      <option value="career">Карьера и деньги</option>
      <option value="spirit">Духовный рост</option>
    </select>
    <p class="err" id="err"></p>
    <button class="btn" type="submit">Запустить анализ потока</button>
  </form>
</section>

<!-- 3. Загрузка -->
<section id="loading" class="screen loader">
  <div class="orb"></div>
  <div id="loadText">Сканирование биополя…</div>
</section>

<!-- 4. Результаты -->
<section id="results" class="screen">
  <div class="card">
    <div class="center" style="margin-bottom:18px"><h2 id="rName" style="font-size:2rem"></h2></div>
    <div class="profile">
      <div><div class="symbol" id="rSym"></div><div class="k">Знак зодиака</div><div class="v" id="rSign"></div></div>
      <div><div class="k">Стихия</div><div class="v" id="rEl"></div></div>
      <div><div class="k">Число судьбы</div><div class="v" id="rNum"></div></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px">Карта чакр</h3>
    <div class="chakras" id="chakras"></div>
    <div id="chInfo">Нажмите на чакру, чтобы узнать о ней больше.</div>
  </div>

  <div class="card visual">
    <div class="vis"><div class="fb"></div>
      <img alt="Космос и аура" loading="lazy" onerror="this.remove()"
        src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=600&auto=format&fit=crop&q=80"></div>
    <div class="vis b"><div class="fb"></div>
      <img alt="Мистический кристалл" loading="lazy" onerror="this.remove()"
        src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&auto=format&fit=crop&q=80"></div>
  </div>

  <div class="card text">
    <h3>Ваш гороскоп</h3><p id="rHoro"></p>
    <h3>Рекомендация</h3><p class="focus" id="rAdvice"></p>
  </div>

  <div class="center"><button class="btn ghost" id="again">Пройти анализ заново</button></div>
</section>

</main>
<script>
/* ===== Данные ===== */
// Знаки зодиака: [название, символ, стихия, месяц начала, день начала]
const SIGNS = [
  ['Козерог','♑','Земля',12,22],['Водолей','♒','Воздух',1,20],['Рыбы','♓','Вода',2,19],
  ['Овен','♈','Огонь',3,21],['Телец','♉','Земля',4,20],['Близнецы','♊','Воздух',5,21],
  ['Рак','♋','Вода',6,21],['Лев','♌','Огонь',7,23],['Дева','♍','Земля',8,23],
  ['Весы','♎','Воздух',9,23],['Скорпион','♏','Вода',10,23],['Стрелец','♐','Огонь',11,22]
];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

// 7 чакр сверху вниз: имя, смысл, цвет, описание
const CHAKRAS = [
  ['Сахасрара','Духовная связь','#b48cff','Венчает путь: ощущение единства с миром, смысла и внутренней тишины.'],
  ['Аджна','Интуиция','#5b6bff','Центр интуиции, ясного видения и мудрости. Отвечает за внутренний голос.'],
  ['Вишудха','Самовыражение','#3db8ff','Голос и честность. Помогает говорить правду и быть услышанным.'],
  ['Анахата','Любовь','#38d39a','Сердечный центр: любовь, сострадание, тёплые и глубокие отношения.'],
  ['Манипура','Воля и сила','#ffd23f','Личная сила, уверенность, достижение целей и финансовая энергия.'],
  ['Свадхистхана','Творчество','#ff9a3d','Радость, чувственность, творчество и эмоциональная гибкость.'],
  ['Муладхара','Опора','#ff4d5e','Корень: безопасность, тело, стабильность и связь с землёй.']
];
// Какая чакра усиливается целью (индекс в CHAKRAS)
const GOAL_CHAKRA = {self:1, love:3, career:4, spirit:0};
const GOAL_TEXT = {
  self:'саморазвитии и росте осознанности',
  love:'отношениях и открытости сердца',
  career:'карьере и материальной реализации',
  spirit:'духовных практиках и поиске смысла'
};
const ELEMENT_TEXT = {
  'Огонь':'Ваша огненная природа даёт смелость и вдохновение — не гасите свой порыв сомнениями.',
  'Земля':'Земная стихия даёт вам устойчивость — доверяйте медленному, но верному шагу.',
  'Воздух':'Воздушная стихия наделяет вас лёгкостью ума — выбирайте одну идею и доведите её до конца.',
  'Вода':'Водная стихия обостряет чувствительность — берегите границы и прислушивайтесь к интуиции.'
};
const NUM_TEXT = {1:'лидерство и инициатива',2:'гармония и партнёрство',3:'творчество и общение',4:'порядок и надёжность',
  5:'свобода и перемены',6:'забота и любовь',7:'поиск истины и глубина',8:'сила и изобилие',9:'мудрость и служение',
  11:'вдохновение и озарения',22:'созидание великого',33:'бескорыстное служение'};
const PRACTICE = [
  'Медитация с белым светом над макушкой по 10 минут в день и время тишины без экранов.',
  'Ведите дневник снов и интуитивных догадок; перед решением закрывайте глаза и слушайте себя.',
  'Говорите вслух то, что чувствуете, пойте или напевайте; не копите невысказанное.',
  'Практикуйте благодарность и глубокое дыхание грудью; уделяйте время близким людям.',
  'Ставьте одну чёткую цель на день, делайте упражнения для корпуса и завершайте начатое.',
  'Дайте себе творческое удовольствие: танец, рисование, вода и тёплые ванны.',
  'Ходите босиком по земле, высыпайтесь, ешьте тёплую простую пищу и наведите порядок в быту.'
];

/* ===== Вспомогательные функции ===== */
const $ = id => document.getElementById(id);

// Определение знака зодиака по дню и месяцу
function getSign(day, month){
  // Ищем последний знак, дата начала которого не позже введённой
  let found = SIGNS[0];
  for(const s of SIGNS){
    if(month > s[3] || (month === s[3] && day >= s[4])) found = s;
  }
  // Январь до 20 числа и т.п. -> Козерог (первый элемент), иначе берём найденный
  if(month === 1 && day < 20) return SIGNS[0];
  return found;
}

// Число судьбы: сумма всех цифр даты, сводим к 1–9 (мастер-числа 11, 22, 33 оставляем)
function destinyNumber(d, m, y){
  let n = String(d)+String(m)+String(y);
  let sum = n.split('').reduce((a,c)=>a+ +c,0);
  while(sum > 9 && ![11,22,33].includes(sum)){
    sum = String(sum).split('').reduce((a,c)=>a+ +c,0);
  }
  return sum;
}

// Детерминированный генератор псевдослучайных чисел (одни данные -> один результат)
function seedRng(str){
  let h = 2166136261;
  for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}

// Проценты активности чакр
function calcChakras(seedStr, goal, number, element){
  const rnd = seedRng(seedStr);
  const levels = CHAKRAS.map(() => 40 + Math.round(rnd()*35));
  levels[GOAL_CHAKRA[goal]] += 15;                       // цель усиливает чакру
  levels[CHAKRAS.length - 1 - ((number-1) % 7)] += 8;    // число судьбы подсвечивает свою
  const elIdx = {Огонь:4,Земля:6,Воздух:2,Вода:5}[element]; // стихия поддерживает свою
  levels[elIdx] += 6;
  return levels.map(v => Math.min(98, v));
}

/* ===== Переключение экранов ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ===== Инициализация формы ===== */
$('m').innerHTML = '<option value="">Месяц</option>' + MONTHS.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('');
$('startBtn').onclick = () => show('formScreen');
$('again').onclick = () => { $('form').reset(); show('landing'); };

/* ===== Отправка формы ===== */
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fn').value.trim(), last = $('ln').value.trim();
  const d = +$('d').value, m = +$('m').value, y = +$('y').value;
  const goal = $('goal').value;

  // Валидация, включая проверку реальности даты
  const date = new Date(y, m-1, d);
  const valid = d && m && y && date.getFullYear()===y && date.getMonth()===m-1 && date.getDate()===d && y>=1900 && date <= new Date();
  if(!name || !last){ $('err').textContent = 'Пожалуйста, введите имя и фамилию.'; return; }
  if(!valid){ $('err').textContent = 'Проверьте дату рождения.'; return; }
  $('err').textContent = '';

  runLoader(() => render({name,last,d,m,y,goal}));
});

// Имитация сканирования
function runLoader(done){
  show('loading');
  const steps = ['Сканирование биополя…','Синхронизация со знаками зодиака…','Расчёт числа судьбы…','Построение карты чакр…'];
  let i = 0; $('loadText').textContent = steps[0];
  const t = setInterval(() => { i = Math.min(i+1, steps.length-1); $('loadText').textContent = steps[i]; }, 500);
  setTimeout(() => { clearInterval(t); done(); }, 2000);
}

/* ===== Построение отчёта ===== */
function render({name,last,d,m,y,goal}){
  const [sign, sym, element] = getSign(d, m);
  const num = destinyNumber(d, m, y);
  const levels = calcChakras(name+last+d+m+y, goal, num, element);
  const focus = GOAL_CHAKRA[goal];

  $('rName').textContent = `${name} ${last}`;
  $('rSym').textContent = sym;
  $('rSign').textContent = sign;
  $('rEl').textContent = element;
  $('rNum').textContent = num;

  // Карта чакр
  $('chakras').innerHTML = CHAKRAS.map((c,i) => `
    <div class="ch" data-i="${i}" style="--c:${c[2]}">
      <span class="dot"></span>
      <div><b>${c[0]}</b><small>${c[1]}</small><div class="bar"><i data-w="${levels[i]}"></i></div></div>
      <span class="pct">${levels[i]}%</span>
    </div>`).join('');
  document.querySelectorAll('.ch').forEach(el => el.onclick = () => selectChakra(+el.dataset.i, levels));
  selectChakra(focus, levels);

  // Гороскоп
  $('rHoro').textContent =
    `${name}, под знаком ${sign} ваша энергия особенно ярко проявляется в ${GOAL_TEXT[goal]}. ` +
    `${ELEMENT_TEXT[element]} Число судьбы ${num} говорит о том, что ваш путь — это ${NUM_TEXT[num]}. ` +
    `Ближайшее время благоприятно для честного взгляда на себя и мягких, но решительных шагов.`;
  $('rAdvice').textContent =
    `Ваша ключевая чакра — ${CHAKRAS[focus][0]} (${levels[focus]}%). ${PRACTICE[focus]} ` +
    `Самая слабая зона — ${CHAKRAS[levels.indexOf(Math.min(...levels))][0]}: уделяйте ей немного внимания каждый день.`;

  show('results');
  // Анимация заполнения полос
  requestAnimationFrame(() => setTimeout(() =>
    document.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%'), 150));
}

// Выбор чакры и показ описания
function selectChakra(i, levels){
  document.querySelectorAll('.ch').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
  const c = CHAKRAS[i];
  $('chInfo').innerHTML = `<b style="color:${c[2]}">${c[0]}</b> — ${c[3]} Текущая активность: ${levels[i]}%.`;
}
</script>
</body>
</html>
